services:
  airflow:
    build: .
    container_name: airflow_hiring
    restart: always

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      # (Opcional) Asegura que Python busque en /opt/airflow/scripts
      PYTHONPATH: /opt/airflow/scripts

    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./scripts:/opt/airflow/scripts:ro   # <--- monta aquí tu código

    command: []

version: "3.9"
services:
  backend:
    build: ./backend
    container_name: sodai_backend
    ports:
      - "8000:8000"
    networks:
      - sodai_net

  frontend:
    build: ./frontend
    container_name: sodai_frontend
    ports:
      - "7860:7860"
    depends_on:
      - backend
    networks:
      - sodai_net

networks:
  sodai_net:
    driver: bridge
